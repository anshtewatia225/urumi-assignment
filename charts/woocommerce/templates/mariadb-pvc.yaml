apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-data
  namespace: {{ .Values.global.storeNamespace }}
  labels:
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/part-of: urumi
spec:
  accessModes:
    - ReadWriteOnce
{{- if .Values.mariadb.storage.storageClassName }}
  storageClassName: {{ .Values.mariadb.storage.storageClassName | quote }}
{{- end }}
  resources:
    requests:
      storage: {{ .Values.mariadb.storage.size }}
