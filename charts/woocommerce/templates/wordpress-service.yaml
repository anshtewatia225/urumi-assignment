apiVersion: v1
kind: Service
metadata:
  name: wordpress
  namespace: {{ .Values.global.storeNamespace }}
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/part-of: urumi
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: wordpress
  ports:
    - name: http
      port: 80
      targetPort: http
