apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: {{ .Values.global.storeNamespace }}
  labels:
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/part-of: urumi
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mariadb
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
