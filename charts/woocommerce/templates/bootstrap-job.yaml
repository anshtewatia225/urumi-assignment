{{- if .Values.bootstrap.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: woocommerce-bootstrap
  namespace: {{ .Values.global.storeNamespace }}
  labels:
    app.kubernetes.io/name: wordpress-bootstrap
    app.kubernetes.io/part-of: urumi
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wordpress-bootstrap
        app.kubernetes.io/part-of: urumi
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 33
      containers:
        - name: bootstrap
          image: {{ .Values.bootstrap.image | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              cd /var/www/html

              # The wp-cli image is Alpine (www-data = uid 82) while the WordPress
              # Apache image is Debian (www-data = uid 33). Run as root and hand the
              # volume to uid 33 so Apache can keep writing to it.
              chown -R 33:33 /var/www/html || true

              echo "Waiting for WordPress files and database..."
              for i in $(seq 1 120); do
                if wp core is-installed >/dev/null 2>&1; then
                  break
                fi
                if [ -f wp-config.php ]; then
                  wp core install \
                    --url="$WP_URL" \
                    --title="$WP_TITLE" \
                    --admin_user="$WP_ADMIN_USER" \
                    --admin_password="$WP_ADMIN_PASSWORD" \
                    --admin_email="$WP_ADMIN_EMAIL" \
                    --skip-email >/dev/null 2>&1 && break
                fi
                sleep 5
              done

              if ! wp core is-installed >/dev/null 2>&1; then
                echo "WordPress installation did not complete" >&2
                exit 1
              fi

              echo "Updating WordPress core if needed..."
              echo "WordPress core before: $(wp core version 2>/dev/null || echo unknown)"
              wp core update --force >/dev/null 2>&1 || true
              wp core update-db >/dev/null 2>&1 || true
              echo "WordPress core after:  $(wp core version 2>/dev/null || echo unknown)"

              echo "Ensuring WooCommerce is installed and active..."
              PLUGIN_VERSION_FLAG=""
              if [ -n "${WOOCOMMERCE_VERSION:-}" ]; then
                PLUGIN_VERSION_FLAG="--version=${WOOCOMMERCE_VERSION}"
              fi
              if ! wp plugin is-installed woocommerce >/dev/null 2>&1; then
                wp plugin install woocommerce --activate $PLUGIN_VERSION_FLAG
              fi
              wp plugin is-active woocommerce >/dev/null 2>&1 || wp plugin activate woocommerce

              echo "Enabling pretty permalinks so /wp-json/ routes to the REST API..."
              wp rewrite structure '/%postname%/' --hard >/dev/null 2>&1 || wp rewrite structure '/%postname%/'
              wp rewrite flush --hard >/dev/null 2>&1 || wp rewrite flush
              echo "Permalink structure: $(wp option get permalink_structure 2>/dev/null || echo plain)"

              wp option update woocommerce_currency USD >/dev/null 2>&1 || true
              wp option update woocommerce_cod_settings '{"enabled":"yes","title":"Cash on delivery","description":"Pay with cash upon delivery.","instructions":"","enable_for_methods":[],"enable_for_virtual":"yes"}' --format=json >/dev/null 2>&1 || true

              if [ "$(wp wc product list --user=1 --format=count 2>/dev/null || echo 0)" = "0" ]; then
                wp wc product create --name="Urumi T-Shirt" --regular_price="24.00" --user=1 >/dev/null 2>&1 || true
                wp wc product create --name="Urumi Coffee Mug" --regular_price="14.50" --user=1 >/dev/null 2>&1 || true
              fi

              echo "Registering WooCommerce REST consumer key for the MCP server..."
              wp eval '
              global $wpdb;
              $ck = getenv("WC_CONSUMER_KEY");
              $cs = getenv("WC_CONSUMER_SECRET");
              if (!$ck || !$cs) { fwrite(STDERR, "missing WooCommerce credentials\n"); exit(1); }
              $table = $wpdb->prefix . "woocommerce_api_keys";
              $id = $wpdb->get_var($wpdb->prepare("SELECT key_id FROM {$table} WHERE consumer_key = %s", wc_api_hash($ck)));
              if (!$id) {
                $wpdb->delete($table, array("description" => "urumi-mcp", "user_id" => 1));
                $wpdb->insert($table, array(
                  "user_id" => 1,
                  "description" => "urumi-mcp",
                  "permissions" => "read_write",
                  "consumer_key" => wc_api_hash($ck),
                  "consumer_secret" => $cs,
                  "truncated_key" => substr($ck, -7),
                  "last_access" => null,
                ));
              }
              '

              chown -R 33:33 /var/www/html || true
              echo "Bootstrap complete."
          env:
            - name: WP_CLI_ALLOW_ROOT
              value: "1"
            - name: WORDPRESS_DB_HOST
              value: mariadb:3306
            - name: WORDPRESS_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecret }}
                  key: WORDPRESS_DB_NAME
            - name: WORDPRESS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecret }}
                  key: WORDPRESS_DB_USER
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecret }}
                  key: WORDPRESS_DB_PASSWORD
            - name: WP_URL
              value: "http://{{ .Values.global.domain.store }}"
            - name: WP_TITLE
              value: {{ .Values.wordpress.title | quote }}
            - name: WOOCOMMERCE_VERSION
              value: {{ .Values.bootstrap.woocommerceVersion | default "" | quote }}
            - name: WP_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecret }}
                  key: WP_ADMIN_USER
            - name: WP_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecret }}
                  key: WP_ADMIN_EMAIL
            - name: WP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecret }}
                  key: WP_ADMIN_PASSWORD
            - name: WC_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecret }}
                  key: WC_CONSUMER_KEY
            - name: WC_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecret }}
                  key: WC_CONSUMER_SECRET
          volumeMounts:
            - name: data
              mountPath: /var/www/html
          resources:
{{ toYaml .Values.bootstrap.resources | indent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: wordpress-data
{{- end }}
