apiVersion: apps/v1
kind: Deployment
metadata:
  name: wc-mcp
  namespace: {{ .Values.global.storeNamespace }}
  labels:
    app.kubernetes.io/name: wc-mcp
    app.kubernetes.io/part-of: urumi
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wc-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wc-mcp
        app.kubernetes.io/part-of: urumi
      annotations:
        # Force a rollout when the WooCommerce credential Secret changes (env is read at start).
        urumi.io/config-revision: {{ .Release.Revision | quote }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: wc-mcp
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: WOOCOMMERCE_URL
              value: {{ .Values.woocommerceUrl | quote }}
            - name: WOOCOMMERCE_OAUTH_BASE_URL
              value: {{ printf "http://%s" .Values.global.domain.store | quote }}
            - name: WOOCOMMERCE_TIMEOUT_MS
              value: {{ .Values.timeoutMs | quote }}
            - name: WOOCOMMERCE_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecret }}
                  key: WC_CONSUMER_KEY
            - name: WOOCOMMERCE_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecret }}
                  key: WC_CONSUMER_SECRET
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
