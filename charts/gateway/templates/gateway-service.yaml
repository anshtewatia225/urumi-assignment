apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: {{ .Values.global.platformNamespace }}
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: urumi
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
