apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Values.global.platformNamespace }}
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: urumi
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
