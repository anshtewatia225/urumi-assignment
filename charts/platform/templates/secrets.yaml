{{- $storeNs := .Values.global.storeNamespace -}}
{{- $platformNs := .Values.global.platformNamespace -}}

{{- $pgExisting := lookup "v1" "Secret" $platformNs "postgres-credentials" -}}
{{- $pgPassword := randAlphaNum 32 -}}
{{- if $pgExisting -}}
{{- $pgPassword = index $pgExisting.data "POSTGRES_PASSWORD" | b64dec -}}
{{- end -}}
{{- $pgUser := .Values.postgres.authUser | default "urumi" -}}
{{- $pgDatabase := .Values.postgres.authDatabase | default "urumi_gateway" -}}

{{- $gwExisting := lookup "v1" "Secret" $platformNs "gateway-secrets" -}}
{{- $sessionSecret := randAlphaNum 48 -}}
{{- $encKey := randBytes 32 -}}
{{- if $gwExisting -}}
{{- $sessionSecret = index $gwExisting.data "SESSION_SECRET" | b64dec -}}
{{- $encKey = index $gwExisting.data "CREDENTIAL_ENCRYPTION_KEY" | b64dec -}}
{{- end -}}
{{- $adminPassword := .Values.secrets.admin.password -}}
{{- if not $adminPassword -}}
{{- if $gwExisting -}}
{{- $adminPassword = index $gwExisting.data "ADMIN_PASSWORD" | b64dec -}}
{{- else -}}
{{- $adminPassword = randAlphaNum 24 -}}
{{- end -}}
{{- end -}}
{{- $llmKey := .Values.secrets.llm.apiKey -}}
{{- if and (not $llmKey) $gwExisting -}}
{{- $llmKey = index $gwExisting.data "LLM_API_KEY" | b64dec -}}
{{- end -}}

{{- $storeExisting := lookup "v1" "Secret" $storeNs "store-credentials" -}}
{{- $wpDbPassword := randAlphaNum 32 -}}
{{- $mariadbRoot := randAlphaNum 32 -}}
{{- $ck := printf "ck_%s" (randAlphaNum 32) -}}
{{- $cs := printf "cs_%s" (randAlphaNum 32) -}}
{{- $wpAdminPassword := .Values.secrets.woocommerce.adminPassword -}}
{{- if not $wpAdminPassword -}}
{{- if $storeExisting -}}
{{- $wpAdminPassword = index $storeExisting.data "WP_ADMIN_PASSWORD" | b64dec -}}
{{- else -}}
{{- $wpAdminPassword = randAlphaNum 24 -}}
{{- end -}}
{{- end -}}
{{- if $storeExisting -}}
{{- $wpDbPassword = index $storeExisting.data "WORDPRESS_DB_PASSWORD" | b64dec -}}
{{- $mariadbRoot = index $storeExisting.data "MARIADB_ROOT_PASSWORD" | b64dec -}}
{{- $ck = index $storeExisting.data "WC_CONSUMER_KEY" | b64dec -}}
{{- $cs = index $storeExisting.data "WC_CONSUMER_SECRET" | b64dec -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: {{ $platformNs }}
  labels:
    app.kubernetes.io/part-of: urumi
type: Opaque
stringData:
  POSTGRES_DB: {{ $pgDatabase | quote }}
  POSTGRES_USER: {{ $pgUser | quote }}
  POSTGRES_PASSWORD: {{ $pgPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-database
  namespace: {{ $platformNs }}
  labels:
    app.kubernetes.io/part-of: urumi
type: Opaque
stringData:
  DATABASE_URL: {{ printf "postgres://%s:%s@postgres:5432/%s" $pgUser $pgPassword $pgDatabase | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
  namespace: {{ $platformNs }}
  labels:
    app.kubernetes.io/part-of: urumi
type: Opaque
stringData:
  SESSION_SECRET: {{ $sessionSecret | quote }}
  CREDENTIAL_ENCRYPTION_KEY: {{ $encKey | quote }}
  ADMIN_EMAIL: {{ .Values.secrets.admin.email | quote }}
  ADMIN_NAME: {{ .Values.secrets.admin.name | quote }}
  ADMIN_PASSWORD: {{ $adminPassword | quote }}
  LLM_API_KEY: {{ $llmKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: store-credentials
  namespace: {{ $storeNs }}
  labels:
    app.kubernetes.io/part-of: urumi
type: Opaque
stringData:
  WORDPRESS_DB_NAME: {{ .Values.secrets.woocommerce.database | quote }}
  WORDPRESS_DB_USER: {{ .Values.secrets.woocommerce.databaseUser | quote }}
  WORDPRESS_DB_PASSWORD: {{ $wpDbPassword | quote }}
  MARIADB_ROOT_PASSWORD: {{ $mariadbRoot | quote }}
  WC_CONSUMER_KEY: {{ $ck | quote }}
  WC_CONSUMER_SECRET: {{ $cs | quote }}
  WP_ADMIN_USER: {{ .Values.secrets.woocommerce.adminUser | quote }}
  WP_ADMIN_EMAIL: {{ .Values.secrets.woocommerce.adminEmail | quote }}
  WP_ADMIN_PASSWORD: {{ $wpAdminPassword | quote }}
